<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Agendamento - Cão Feliz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <header class="bg-dark text-white p-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">PetShop Cão Feliz</h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="servicos.html">Serviços</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container py-5">
        <div class="card shadow p-4 border-0">
            <h2 class="text-center text-primary mb-4">Cadastro de Cliente e Pet</h2>
            
            <form id="formPet" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" placeholder="Mônica Santos" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail *</label>
                    <input type="email" class="form-control" placeholder="email@exemplo.com" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CPF *</label>
                    <input type="text" class="form-control" placeholder="000.000.000-00" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sexo</label>
                    <div class="mt-2">
                        <input type="radio" name="sexo" value="M"> M 
                        <input type="radio" name="sexo" value="F" class="ms-2"> F
                    </div>
                </div>

                <div class="col-12 mt-4"><hr><h4>Informações do Pet</h4></div>
                <div class="col-md-4">
                    <label class="form-label">Nome do Pet *</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Raça</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Idade (anos)</label>
                    <input type="number" class="form-control" min="0">
                </div>

                <div class="col-12 mt-4"><hr><h4>Agendamento de Serviço</h4></div>
                <div class="col-md-6">
                    <label class="form-label">Serviço</label>
                    <select class="form-select">
                        <option>Banho</option>
                        <option>Tosa</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data e Horário *</label>
                    <input type="datetime-local" class="form-control" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label d-block">Forma de Entrega</label>
                    <input type="checkbox" id="tele"> <label for="tele">Tele-busca</label>
                    <input type="checkbox" id="local" class="ms-3"> <label for="local">Entrega no local</label>
                </div>

                <div class="col-12 text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Finalizar Agendamento</button>
                    <a href="index.html" class="btn btn-secondary btn-lg">Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-white text-center p-4">
        <p id="relogioDigital"></p>
        <p class="mb-0">&copy; 2026 Mônica Santos - Projeto Acadêmico.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
